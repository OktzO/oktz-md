[package]
name = "ourin-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.2", features = ["full"] }
napi-derive = "3.6.3"
tesseract-rs = { version = "0.4.0", features = ["embed-tessdata"] }
image = "0.25"

[build-dependencies]
napi-build = "2.4.1"

[profile.release]
lto = true
strip = "symbols"
